name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de versão para lançamento (ex: v0.2.0)'
        required: false
        default: ''

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os-name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os-name: 'Windows'
          - platform: 'macos-latest'
            os-name: 'macOS'
          - platform: 'ubuntu-22.04'
            os-name: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build and Publish with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura opcional caso habilite o tauri-plugin-updater no futuro:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'GraphFinder ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## GraphFinder ${{ github.event.inputs.tag || github.ref_name }}
            
            Instaladores e executáveis oficiais para Windows, macOS e Linux.
            
            ### 📦 Binários disponíveis:
            - **Windows**: `.exe` (NSIS) e `.msi` (WiX)
            - **macOS**: `.dmg` (Apple Silicon)
            - **Linux**: `.deb` (Debian/Ubuntu) e `.AppImage`
            
            ---
            *Compilado e distribuído automaticamente via GitHub Actions.*
          releaseDraft: false
          prerelease: false
