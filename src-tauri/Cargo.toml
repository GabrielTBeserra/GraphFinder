[package]
name = "graphfinder"
version = "0.15.0"
description = "GraphFinder - Neural Knowledge Graph & Local Semantic Vault in Tauri"
authors = ["GraphFinder Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/GabrielTBeserra/GraphFinder"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "GraphFinder"
path = "src/main.rs"

[features]
default = []
# GPU execution providers. directml/coreml are enabled automatically via
# target-specific deps below; gpu-cuda/gpu-rocm stay opt-in for packagers
# because they switch the downloaded ONNX Runtime binary flavor.
gpu-dml = ["ort/directml"]
gpu-coreml = ["ort/coreml"]
gpu-cuda = ["ort/cuda"]
gpu-rocm = ["ort/rocm"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = "4"
ort = { version = "=2.0.0-rc.9", default-features = false }
clap = { version = "4", features = ["derive"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
log = "0.4"
rfd = "0.15"
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13", default-features = false }
notify-debouncer-mini = "0.6"
dirs = "6"
tokio-stream = { version = "0.1", features = ["sync"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.9", features = ["directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.9", features = ["coreml"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
