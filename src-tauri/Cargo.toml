[package]
name = "graphfinder"
version = "0.2.0"
description = "GraphFinder - Neural Knowledge Graph & Local Semantic Vault in Tauri"
authors = ["GraphFinder Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/SEU_USUARIO/GraphFinder"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = "4"
clap = { version = "4", features = ["derive"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
log = "0.4"
rfd = "0.15"
