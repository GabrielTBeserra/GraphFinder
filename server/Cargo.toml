[workspace]
resolver = "2"
members = [
    "crates/gf-core",
    "crates/gf-storage",
    "crates/gf-indexer",
    "crates/gf-mcp",
    "crates/gf-server",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
