<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="560" fill="#090a0f" />

  <!-- Window Container -->
  <rect x="60" y="40" width="1080" height="480" rx="14" fill="#111318" stroke="#262933" stroke-width="1.5" />

  <!-- Window Header / Titlebar -->
  <path d="M 60,40 L 1140,40 A 14 14 0 0 1 1140,88 L 60,88 A 0 0 0 0 1 60,88 Z" fill="#14171f" />
  <line x1="60" y1="88" x2="1140" y2="88" stroke="#1f232d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="88" cy="64" r="5" fill="#323642" />
  <circle cx="106" cy="64" r="5" fill="#323642" />
  <circle cx="124" cy="64" r="5" fill="#323642" />

  <!-- Titlebar App Brand -->
  <text x="156" y="68" class="sans" font-size="13" font-weight="600" fill="#f1f5f9" letter-spacing="0.3">GraphFinder</text>
  <rect x="246" y="55" width="48" height="18" rx="4" fill="#1e222d" stroke="#2d3342" stroke-width="1" />
  <text x="254" y="68" class="mono" font-size="10" font-weight="600" fill="#94a3b8">v0.2.0</text>

  <!-- Project Indicator in Header -->
  <rect x="490" y="53" width="220" height="22" rx="6" fill="#161922" stroke="#262a36" stroke-width="1" />
  <circle cx="504" cy="64" r="3.5" fill="#10b981" />
  <text x="516" y="68" class="sans" font-size="11" font-weight="500" fill="#cbd5e1">vaults / cognitive-core</text>

  <text x="1010" y="68" class="mono" font-size="11" fill="#64748b">mcp: 127.0.0.1:45123</text>

  <!-- Sidebar (Left Column) -->
  <rect x="60" y="88" width="230" height="432" fill="#0d0f14" />
  <line x1="290" y1="88" x2="290" y2="520" stroke="#1f232d" stroke-width="1" />

  <!-- Sidebar Content -->
  <text x="84" y="122" class="sans" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.8">KNOWLEDGE VAULT</text>

  <!-- Active File Item -->
  <rect x="76" y="136" width="198" height="32" rx="6" fill="#1a1e28" stroke="#2c3242" stroke-width="1" />
  <text x="92" y="156" class="sans" font-size="12" font-weight="600" fill="#f8fafc">Architecture.md</text>

  <text x="92" y="196" class="sans" font-size="12" font-weight="400" fill="#94a3b8">NeuralChunking.md</text>
  <text x="92" y="232" class="sans" font-size="12" font-weight="400" fill="#94a3b8">McpServerSync.md</text>
  <text x="92" y="268" class="sans" font-size="12" font-weight="400" fill="#94a3b8">FastEmbedRuntime.md</text>
  <text x="92" y="304" class="sans" font-size="12" font-weight="400" fill="#94a3b8">TopologyGraph.md</text>

  <!-- Vault Stats Box -->
  <rect x="76" y="416" width="198" height="84" rx="8" fill="#12151c" stroke="#1e222d" stroke-width="1" />
  <text x="90" y="440" class="sans" font-size="11" font-weight="600" fill="#cbd5e1">Vault Overview</text>
  <text x="90" y="464" class="mono" font-size="11" fill="#64748b">Nodes: <tspan fill="#f8fafc" font-weight="600">148</tspan>  Edges: <tspan fill="#f8fafc" font-weight="600">312</tspan></text>
  <text x="90" y="484" class="mono" font-size="11" fill="#64748b">Semantic Chunks: <tspan fill="#f8fafc" font-weight="600">624</tspan></text>

  <!-- Graph View (Center Area) -->
  <g stroke-linecap="round">
    <!-- Minimal Clean Network Lines (Monochrome with Slate Accent) -->
    <line x1="430" y1="210" x2="520" y2="160" stroke="#2c3344" stroke-width="1.5" />
    <line x1="520" y1="160" x2="620" y2="180" stroke="#2c3344" stroke-width="1.5" />
    <line x1="620" y1="180" x2="560" y2="280" stroke="#4f46e5" stroke-width="2" />
    <line x1="560" y1="280" x2="430" y2="210" stroke="#4f46e5" stroke-width="2" />
    <line x1="560" y1="280" x2="480" y2="380" stroke="#2c3344" stroke-width="1.5" />
    <line x1="480" y1="380" x2="410" y2="320" stroke="#2c3344" stroke-width="1.5" />
    <line x1="410" y1="320" x2="430" y2="210" stroke="#2c3344" stroke-width="1.5" />
    <line x1="560" y1="280" x2="670" y2="340" stroke="#4f46e5" stroke-width="2" />
    <line x1="670" y1="340" x2="730" y2="260" stroke="#2c3344" stroke-width="1.5" />
    <line x1="730" y1="260" x2="620" y2="180" stroke="#2c3344" stroke-width="1.5" />
    <line x1="670" y1="340" x2="610" y2="420" stroke="#2c3344" stroke-width="1.5" />
    <line x1="610" y1="420" x2="480" y2="380" stroke="#2c3344" stroke-width="1.5" />

    <!-- Satellite Nodes & Edges -->
    <line x1="360" y1="180" x2="430" y2="210" stroke="#232936" stroke-width="1.2" />
    <line x1="530" y1="110" x2="520" y2="160" stroke="#232936" stroke-width="1.2" />
    <line x1="680" y1="140" x2="620" y2="180" stroke="#232936" stroke-width="1.2" />
    <line x1="780" y1="310" x2="730" y2="260" stroke="#232936" stroke-width="1.2" />
    <line x1="380" y1="390" x2="410" y2="320" stroke="#232936" stroke-width="1.2" />
    <line x1="680" y1="450" x2="610" y2="420" stroke="#232936" stroke-width="1.2" />

    <!-- Satellite Points -->
    <circle cx="360" cy="180" r="3.5" fill="#475569" />
    <circle cx="530" cy="110" r="3.5" fill="#475569" />
    <circle cx="680" cy="140" r="3.5" fill="#475569" />
    <circle cx="780" cy="310" r="3.5" fill="#475569" />
    <circle cx="380" cy="390" r="3.5" fill="#475569" />
    <circle cx="680" cy="450" r="3.5" fill="#475569" />

    <!-- Network Solid Nodes -->
    <circle cx="430" cy="210" r="6" fill="#cbd5e1" />
    <circle cx="520" cy="160" r="5" fill="#94a3b8" />
    <circle cx="620" cy="180" r="6.5" fill="#cbd5e1" />
    <circle cx="480" cy="380" r="5.5" fill="#94a3b8" />
    <circle cx="410" cy="320" r="5" fill="#94a3b8" />
    <circle cx="670" cy="340" r="6" fill="#cbd5e1" />
    <circle cx="730" cy="260" r="5.5" fill="#94a3b8" />
    <circle cx="610" cy="420" r="5" fill="#94a3b8" />

    <!-- Focal Found Node (High Priority Knowledge Center) -->
    <circle cx="560" cy="280" r="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2.5" />
    <circle cx="560" cy="280" r="6" fill="#ffffff" />
  </g>

  <!-- Node Tag Label -->
  <rect x="522" y="306" width="76" height="18" rx="4" fill="#181b24" stroke="#2b3140" stroke-width="1" />
  <text x="560" y="319" class="sans" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="middle">#core-rag</text>

  <!-- Right Panel (Markdown Preview & Semantic Chunks) -->
  <line x1="820" y1="88" x2="820" y2="520" stroke="#1f232d" stroke-width="1" />
  <rect x="820" y="88" width="320" height="432" fill="#0d0f14" />

  <!-- Markdown Document Header -->
  <text x="844" y="126" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Architecture.md</text>
  <text x="844" y="146" class="sans" font-size="11" fill="#64748b">Local FastEmbed &amp; SQLite WAL Indexing</text>

  <!-- Markdown Code Block -->
  <rect x="844" y="164" width="272" height="180" rx="6" fill="#13161f" stroke="#1e222d" stroke-width="1" />
  <text x="858" y="188" class="mono" font-size="11" fill="#93c5fd">## 1. Atomic Chunking</text>
  <text x="858" y="210" class="sans" font-size="10" fill="#94a3b8">Splits by H2/H3 headers.</text>
  <text x="858" y="226" class="sans" font-size="10" fill="#94a3b8">Generates isolated vector points.</text>

  <text x="858" y="254" class="mono" font-size="11" fill="#a78bfa">## 2. MCP Response</text>
  <text x="858" y="276" class="sans" font-size="10" fill="#94a3b8">Retrieves precision sub-chunks.</text>
  <text x="858" y="292" class="sans" font-size="10" fill="#64748b">Tokens: ~48 per query.</text>
  <text x="858" y="316" class="sans" font-size="10" fill="#38bdf8">Link: [[Architecture#2. MCP]]</text>

  <!-- Semantic Search Bar -->
  <rect x="844" y="360" width="272" height="34" rx="6" fill="#171b26" stroke="#2d3446" stroke-width="1" />
  <circle cx="862" cy="377" r="4" stroke="#64748b" stroke-width="1.5" fill="none" />
  <line x1="865" y1="380" x2="870" y2="385" stroke="#64748b" stroke-width="1.5" />
  <text x="878" y="381" class="sans" font-size="11" fill="#94a3b8">search_semantic("sqlite wal")...</text>

  <!-- Result Pill -->
  <rect x="844" y="408" width="272" height="88" rx="6" fill="#13161f" stroke="#222736" stroke-width="1" />
  <text x="858" y="432" class="mono" font-size="10" font-weight="600" fill="#10b981">Match 0.89 affinity</text>
  <text x="858" y="452" class="sans" font-size="11" font-weight="600" fill="#e2e8f0">[[Architecture#2. SQLite WAL]]</text>
  <text x="858" y="472" class="sans" font-size="10" fill="#64748b">Concurrent zero-lock query mode.</text>
</svg>
