<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Minimalist Charcoal Slate Background -->
  <rect width="512" height="512" rx="112" fill="#111318" />

  <!-- Graph Finder Minimalist Geometry (Zero neon, pure clean Swiss lines) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Graph Edges -->
    <path d="M 180,160 L 332,160" stroke="#475569" stroke-width="12" />
    <path d="M 180,160 L 180,256" stroke="#475569" stroke-width="12" />
    <path d="M 180,256 L 180,352" stroke="#475569" stroke-width="12" />
    <path d="M 180,352 L 332,352" stroke="#475569" stroke-width="12" />
    <path d="M 332,352 L 332,256" stroke="#475569" stroke-width="12" />
    <path d="M 332,256 L 256,256" stroke="#6366f1" stroke-width="12" />
    <path d="M 256,352 L 332,256" stroke="#475569" stroke-width="12" />
  </g>

  <!-- Solid Clean Nodes (Outer Network) -->
  <circle cx="180" cy="160" r="22" fill="#f8fafc" />
  <circle cx="332" cy="160" r="22" fill="#f8fafc" />
  <circle cx="180" cy="256" r="22" fill="#f8fafc" />
  <circle cx="180" cy="352" r="22" fill="#f8fafc" />
  <circle cx="332" cy="352" r="22" fill="#f8fafc" />
  <circle cx="332" cy="256" r="22" fill="#f8fafc" />

  <!-- Focal Found Node (Finder / Knowledge Node in Muted Slate Indigo) -->
  <circle cx="256" cy="256" r="26" fill="#6366f1" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />
</svg>
