<!doctype html>
<html lang="en" style="background-color: #120f0d; color: #efe9df;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120f0d" />
    <meta
      name="description"
      content="GraphFinder: Neural Knowledge Graph, Local Markdown Vault, and Token-Efficient AI RAG Engine"
    />
    <title>GraphFinder | Neural Knowledge Graph & Semantic Vault</title>
  </head>
  <body style="background-color: #120f0d; color: #efe9df; margin: 0; padding: 0; overflow: hidden;">
    <div id="root" style="background-color: #120f0d; width: 100%; height: 100%;">
      <!-- Boot splash — pure CSS, replaced by React on mount -->
      <style>
        #gf-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#120f0d;font-family:system-ui,-apple-system,sans-serif}
        #gf-splash .const{width:150px;height:110px}
        #gf-splash .e{stroke:#3a322b;stroke-width:1;stroke-dasharray:60;stroke-dashoffset:60;animation:gfDraw 1.6s cubic-bezier(.16,1,.3,1) forwards}
        #gf-splash .n{fill:#a39888;opacity:0;animation:gfNode .7s cubic-bezier(.16,1,.3,1) forwards}
        #gf-splash .n.acc{fill:#d97c53}
        #gf-splash .pulse{fill:none;stroke:#d97c53;stroke-width:1.4;transform-origin:center;transform-box:fill-box;animation:gfRing 2s ease-out infinite}
        #gf-splash .mark{font-family:Georgia,'Times New Roman',serif;font-size:26px;letter-spacing:.01em;color:#efe9df;opacity:0;animation:gfUp .9s .5s cubic-bezier(.16,1,.3,1) forwards}
        #gf-splash .eyebrow{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#6b6154;opacity:0;animation:gfUp .9s .7s cubic-bezier(.16,1,.3,1) forwards}
        #gf-splash .stat{display:flex;align-items:center;gap:8px;font-family:ui-monospace,'Cascadia Mono',monospace;font-size:10.5px;color:#a39888;opacity:0;animation:gfUp .6s .55s cubic-bezier(.16,1,.3,1) forwards}
        #gf-splash .dot{width:6px;height:6px;border-radius:50%;background:#d97c53;animation:gfPulse 1.4s ease-in-out infinite}
        @keyframes gfDraw{to{stroke-dashoffset:0}}
        @keyframes gfNode{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
        @keyframes gfRing{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(2.4)}}
        @keyframes gfUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes gfPulse{0%,100%{opacity:1}50%{opacity:.3}}
        @media (prefers-reduced-motion:reduce){#gf-splash *{animation-duration:.01s;animation-delay:0s}}
      </style>
      <div id="gf-splash" aria-hidden="true">
        <svg class="const" viewBox="0 0 150 110" fill="none">
          <path class="e" style="animation-delay:.05s" d="M30 78 L62 52"/>
          <path class="e" style="animation-delay:.15s" d="M62 52 L96 66"/>
          <path class="e" style="animation-delay:.25s" d="M62 52 L84 28"/>
          <path class="e" style="animation-delay:.2s" d="M96 66 L122 44"/>
          <path class="e" style="animation-delay:.45s" d="M84 28 L122 44"/>
          <path class="e" style="animation-delay:.55s" d="M96 66 L112 90"/>
          <circle class="n" style="animation-delay:.02s" cx="30" cy="78" r="4"/>
          <circle class="n acc" style="animation-delay:.2s" cx="62" cy="52" r="5.5"/>
          <circle class="n" style="animation-delay:.5s" cx="96" cy="66" r="3.5"/>
          <circle class="n" style="animation-delay:.6s" cx="84" cy="28" r="4"/>
          <circle class="n acc" style="animation-delay:.8s" cx="122" cy="44" r="4.5"/>
          <circle class="n" style="animation-delay:.65s" cx="112" cy="90" r="3.5"/>
          <circle class="pulse" style="animation-delay:1.02s" cx="62" cy="52" r="8"/>
          <circle class="pulse" style="animation-delay:1.2s" cx="122" cy="44" r="8"/>
        </svg>
        <div class="mark">GraphFinder</div>
        <div class="eyebrow">Neural Knowledge Graph</div>
        <div class="stat"><span class="dot"></span><span>Initializing engine&hellip;</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
